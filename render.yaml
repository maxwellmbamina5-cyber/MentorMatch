databases:
  - name: mentormatch-db
    databaseName: mentormatch
    user: mentormatch
    plan: basic-256mb
    region: frankfurt

services:
  - type: web
    name: mentormatch
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: yarn install --frozen-lockfile && yarn build
    startCommand: yarn start
    healthCheckPath: /api/health
    disk:
      name: mentormatch-uploads
      mountPath: /var/www/html/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mentormatch-db
          property: connectionString
      - key: APP_MODE
        value: production
      - key: DEBUG_MODE
        value: "false"
      - key: SEND_EMAILS
        value: "false"
      - key: APP_BASE_PATH
        value: /
      - key: PORT
        value: "10000"
      - key: SESSION_SECRET
        generateValue: true
